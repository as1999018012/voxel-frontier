plugins {
    id 'application'
}

group = 'voxelfrontier'
version = '0.1.0'

def lwjglVersion = '3.4.3'
def jomlVersion = '1.10.9'
def junitVersion = '6.1.3'

// LWJGLのネイティブライブラリ。対象機種すべて分を同梱しておき、
// 実行時にLWJGLが自分のOS/CPUに合うものを自動で選ぶ。
// Windows 11 (x64) -> natives-windows、PGX (Linux aarch64) -> natives-linux-arm64
// こうしておくと、どちらの機種でビルドした配布物 (installDist) でも両方で動く。
def lwjglNatives = ['natives-windows', 'natives-linux', 'natives-linux-arm64']

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'

    lwjglNatives.each { natives ->
        runtimeOnly "org.lwjgl:lwjgl::$natives"
        runtimeOnly "org.lwjgl:lwjgl-glfw::$natives"
        runtimeOnly "org.lwjgl:lwjgl-opengl::$natives"
    }

    // 3D数学ライブラリ (行列・ベクトル)
    implementation "org.joml:joml:$jomlVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'voxelfrontier.Main'
}

tasks.named('test') {
    useJUnitPlatform()
}
